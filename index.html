<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pitch Deck Builder</title>
<meta name="description" content="Build a live sponsor pitch deck: brand it, connect your numbers, embed your media, and share one link that stays current.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=Source+Sans+3:wght@400;600;700&amp;family=Source+Serif+4:opsz,wght@8..60,400;600;700&amp;display=swap">
<style>
/* ---------- Builder chrome ---------- */
:root{
  --c-bg:#eceff1; --c-panel:#ffffff; --c-ink:#1b232a; --c-ink2:#55606a; --c-ink3:#7a858e;
  --c-rule:#d5dbe0; --c-field:#f6f8f9; --c-act:#14527a; --c-act-ink:#ffffff; --c-warn:#9a5b00;
  --c-focus:#2a78d6;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{ --c-bg:#11171c; --c-panel:#182129; --c-ink:#e4e9ec; --c-ink2:#a9b4bd; --c-ink3:#83909a;
    --c-rule:#2b3741; --c-field:#1f2a33; --c-act:#4f9fd6; --c-act-ink:#0d1418; --c-warn:#e3a54a; color-scheme:dark; }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--c-bg);color:var(--c-ink);font:15px/1.45 "Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;font-stretch:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--c-focus);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px 14px;background:var(--c-panel);border-bottom:1px solid var(--c-rule)}
.topbar .name{font-weight:800;font-stretch:118%;font-size:17px;letter-spacing:-.01em;margin-right:auto;white-space:nowrap}
.topbar .name small{font-weight:500;font-stretch:100%;color:var(--c-ink3);font-size:13px;margin-left:8px}
.btn{border:1px solid var(--c-rule);background:var(--c-panel);border-radius:6px;padding:6px 11px;cursor:pointer;line-height:1.2;white-space:nowrap}
.btn:hover{border-color:var(--c-ink3)}
.btn.primary{background:var(--c-act);border-color:var(--c-act);color:var(--c-act-ink);font-weight:600}
.btn.small{padding:3px 8px;font-size:13px}
.btn.icon{padding:3px 7px;font-size:13px;min-width:28px}
.btn.danger:hover{border-color:#c43c3c;color:#c43c3c}

.workspace{display:grid;grid-template-columns:minmax(340px,430px) 1fr;height:calc(100vh - 53px)}
.editor{background:var(--c-panel);border-right:1px solid var(--c-rule);overflow:auto;display:flex;flex-direction:column}
.tabs{display:flex;border-bottom:1px solid var(--c-rule);position:sticky;top:0;background:var(--c-panel);z-index:5}
.tabs button{flex:1;border:0;background:none;padding:11px 8px;cursor:pointer;color:var(--c-ink2);border-bottom:2px solid transparent;font-weight:600}
.tabs button[aria-selected="true"]{color:var(--c-ink);border-bottom-color:var(--c-act)}
.panel{padding:14px 16px 40px}
.panel[hidden]{display:none}
.panel h2{font-size:15px;margin:18px 0 8px;font-weight:700}
.panel h2:first-child{margin-top:4px}
.hint{color:var(--c-ink2);font-size:13px;margin:4px 0 10px}
.hint code{background:var(--c-field);padding:1px 4px;border-radius:3px;font-size:12px}

.fld{margin:0 0 10px}
.fld>label,.fld .lbl{display:block;font-size:13px;font-weight:600;color:var(--c-ink2);margin-bottom:3px}
.fld input[type=text],.fld input[type=url],.fld input[type=number],.fld input[type=email],.fld select,.fld textarea{
  width:100%;background:var(--c-field);border:1px solid var(--c-rule);border-radius:5px;padding:6px 8px}
.fld textarea{min-height:70px;resize:vertical}
.fld textarea.csv{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;min-height:120px;white-space:pre}
.fld input[type=color]{width:44px;height:32px;border:1px solid var(--c-rule);border-radius:5px;padding:2px;background:var(--c-field)}
.fld .row{display:flex;gap:6px;align-items:center}
.fld .row>input{flex:1}
.fld-checkbox label{display:flex;gap:8px;align-items:center;font-weight:500;color:var(--c-ink)}
.fld .help{font-size:12px;color:var(--c-ink3);margin-top:3px}
.checks{display:flex;flex-wrap:wrap;gap:4px 12px;background:var(--c-field);border:1px solid var(--c-rule);border-radius:5px;padding:6px 8px;font-size:13px}
.checks label{display:flex;gap:5px;align-items:center}
.checks .none{color:var(--c-ink3)}
.items{display:flex;flex-direction:column;gap:8px}
fieldset.item{border:1px solid var(--c-rule);border-radius:6px;padding:8px 10px 2px;margin:0}
fieldset.item legend{display:flex;gap:4px;align-items:center;padding:0 4px;font-size:13px;font-weight:600;max-width:100%}
fieldset.item legend span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:190px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}

details.card{border:1px solid var(--c-rule);border-radius:7px;margin-bottom:8px;background:var(--c-panel)}
details.card[open]{border-color:var(--c-ink3)}
details.card>summary{list-style:none;display:flex;align-items:center;gap:6px;padding:8px 10px;cursor:pointer}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary .t{flex:1;min-width:0}
details.card>summary .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
details.card>summary .t small{color:var(--c-ink3);font-size:12px}
details.card>summary .chev{width:10px;color:var(--c-ink3);transition:transform .15s}
details.card[open]>summary .chev{transform:rotate(90deg)}
details.card .body{padding:4px 12px 10px;border-top:1px solid var(--c-rule)}
.addrow{display:flex;gap:6px;margin-top:10px}
.addrow select{flex:1;background:var(--c-field);border:1px solid var(--c-rule);border-radius:5px;padding:6px 8px}
.status{font-size:12px;color:var(--c-ink2);margin:6px 0}
.status.err{color:#c43c3c}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 8px}
.chips span{font-size:12px;background:var(--c-field);border:1px solid var(--c-rule);border-radius:10px;padding:1px 8px}

.preview{overflow:auto;padding:22px;position:relative}
.preview .frame{max-width:1240px;margin:0 auto;border:1px solid var(--c-rule);border-radius:8px;overflow:hidden;box-shadow:0 1px 2px rgba(20,30,40,.06)}
.mode-build .deck section.sec{cursor:pointer}
.mode-build .deck section.sec:hover{outline:2px dashed color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:-6px}

/* View mode */
.mode-view .topbar,.mode-view .editor{display:none}
.mode-view .workspace{display:block;height:auto}
.mode-view .preview{padding:0;overflow:visible}
.mode-view .preview .frame{max-width:none;border:0;border-radius:0;box-shadow:none}
.viewbar{position:fixed;right:14px;bottom:14px;z-index:30;display:none;gap:4px;padding:5px;border-radius:9px;background:color-mix(in srgb,var(--c-panel) 92%,transparent);border:1px solid var(--c-rule);box-shadow:0 4px 16px rgba(10,20,30,.16);backdrop-filter:blur(6px)}
.mode-view ~ .viewbar{display:flex}
.viewbar .btn{border-color:transparent;background:transparent;font-size:13px}
.viewbar .btn:hover{border-color:var(--c-rule)}
.viewbar .btn[aria-pressed="true"]{background:var(--c-field);border-color:var(--c-rule)}

dialog{border:1px solid var(--c-rule);border-radius:10px;background:var(--c-panel);color:var(--c-ink);max-width:640px;width:calc(100% - 32px);padding:20px 22px}
dialog::backdrop{background:rgba(10,16,22,.45)}
dialog h2{margin:0 0 6px;font-size:19px;font-weight:800;font-stretch:112%}
dialog h3{margin:18px 0 4px;font-size:15px}
dialog textarea{width:100%;font-family:ui-monospace,Menlo,monospace;font-size:12px;min-height:64px;background:var(--c-field);border:1px solid var(--c-rule);border-radius:5px;padding:6px 8px;word-break:break-all}
dialog .actions{display:flex;gap:6px;justify-content:flex-end;margin-top:16px}
dialog .warn{color:var(--c-warn);font-size:13px}
dialog input[type=url]{width:100%;background:var(--c-field);border:1px solid var(--c-rule);border-radius:5px;padding:6px 8px}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--c-ink);color:var(--c-panel);padding:8px 14px;border-radius:7px;font-size:14px;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
.toast.on{opacity:1}

@media (max-width:900px){
  .workspace{grid-template-columns:1fr;height:auto}
  .editor{max-height:none;border-right:0;border-bottom:1px solid var(--c-rule)}
  .preview{padding:10px}
}

/* ---------- Deck (the pitch itself) ---------- */
.deck{
  --bg:#edf0f2; --surface:#ffffff; --ink:#15202b; --ink2:#4a5763; --ink3:#6b7884; --rule:#d2d9de;
  --good:#0a7d0a; --bad:#c43c3c;
  --display:"Archivo",system-ui,sans-serif; --text:"Archivo",system-ui,sans-serif; --display-stretch:125%; --display-weight:800;
  background:var(--bg);color:var(--ink);font-family:var(--text);font-size:17px;line-height:1.5;font-stretch:100%;
  -webkit-font-smoothing:antialiased;
}
.deck.scheme-dark{--bg:#0f161c;--surface:#17212a;--ink:#e6ebee;--ink2:#adb8c1;--ink3:#86929c;--rule:#2b3742;--good:#35c235;--bad:#ef6b6b;color-scheme:dark}
.deck.font-serif{--display:"Source Serif 4",Georgia,serif;--text:"Source Sans 3",system-ui,sans-serif;--display-stretch:100%;--display-weight:700}
.deck.font-system{--display:system-ui,-apple-system,"Segoe UI",sans-serif;--text:system-ui,-apple-system,"Segoe UI",sans-serif;--display-stretch:100%;--display-weight:750}
.deck .wrap{max-width:1120px;margin:0 auto;padding:0 40px}
.deck section.sec{padding:72px 0;border-top:1px solid var(--rule);position:relative}
.deck section.sec:first-child{border-top:0}
.deck h2.sh{font-family:var(--display);font-stretch:var(--display-stretch);font-weight:var(--display-weight);font-size:clamp(28px,3.4vw,40px);line-height:1.08;letter-spacing:-.015em;margin:0 0 14px;max-width:22ch}
.deck .intro{color:var(--ink2);max-width:62ch;margin:0 0 32px;font-size:18px}
.deck .intro p{margin:0 0 .7em}
.deck a{color:inherit;text-decoration-color:color-mix(in srgb,var(--accent) 70%,transparent);text-underline-offset:3px}
.deck .srcline{font-size:13px;color:var(--ink3);margin-top:14px}
.deck .empty{border:1.5px dashed var(--rule);border-radius:8px;padding:28px;text-align:center;color:var(--ink3);font-size:15px}

/* cover */
.deck .cover{padding:0;border-top:0;min-height:min(86vh,760px);display:flex;align-items:stretch;background:var(--surface);position:relative;overflow:hidden}
.deck .cover .bgimg{position:absolute;inset:0;background-size:cover;background-position:center}
.deck .cover .bgimg::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--surface) 30%,color-mix(in srgb,var(--surface) 70%,transparent) 65%,color-mix(in srgb,var(--surface) 20%,transparent))}
.deck .cover .wrap{position:relative;display:flex;flex-direction:column;justify-content:space-between;width:100%;padding-top:40px;padding-bottom:44px}
.deck .cover .logo{height:52px;width:auto;max-width:220px;object-fit:contain;align-self:flex-start}
.deck .cover .bar{height:10px;width:96px;background:var(--accent);align-self:flex-start}
.deck .cover h1{font-family:var(--display);font-stretch:var(--display-stretch);font-weight:var(--display-weight);font-size:clamp(46px,8.6vw,124px);line-height:.92;letter-spacing:-.03em;margin:48px 0 22px;max-width:11ch;text-wrap:balance}
.deck .cover .sub{font-size:clamp(18px,1.8vw,23px);color:var(--ink2);max-width:40ch;margin:0 0 32px;line-height:1.4}
.deck .cover .foot{display:flex;flex-wrap:wrap;align-items:center;gap:18px 28px}
.deck .cta{display:inline-block;background:var(--accent);color:var(--accent-ink);text-decoration:none;font-weight:700;padding:13px 22px;border-radius:4px;font-size:17px}
.deck .cta:hover{filter:brightness(1.08)}
.deck .cta.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink3)}
.deck .stamp{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink2)}
.deck .stamp .dot{width:9px;height:9px;border-radius:50%;background:var(--ink3);flex:none}
.deck .stamp.live .dot{background:var(--good);box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 60%,transparent);animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 55%,transparent)}70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.deck .stamp.live .dot{animation:none}}

/* stats */
.deck .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:30px 0}
.deck .tile{padding:2px 24px 0 22px;border-left:1px solid var(--rule)}
.deck .tile:first-child{border-left-color:var(--accent);border-left-width:3px}
.deck .tile .lab{font-size:15px;color:var(--ink2);margin-bottom:6px}
.deck .tile .val{font-family:var(--display);font-stretch:var(--display-stretch);font-weight:var(--display-weight);font-size:clamp(34px,3.6vw,50px);line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.deck .tile .delta{font-size:14px;margin-top:9px;color:var(--ink2)}
.deck .tile .delta b{font-weight:700}
.deck .tile .delta.up b{color:var(--good)}
.deck .tile .delta.down b{color:var(--bad)}
.deck .tile .note{font-size:13px;color:var(--ink3);margin-top:6px}

/* charts */
.deck .chart-wrap{position:relative;background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:18px 18px 10px}
.deck .chart{width:100%;min-height:60px}
.deck .chart svg{display:block;width:100%;height:auto;overflow:visible}
.deck .chart text{fill:var(--ink3);font-size:12px;font-family:var(--text)}
.deck .chart .lbl-strong{fill:var(--ink);font-weight:600}
.deck .chart .grid{stroke:var(--rule);stroke-width:1}
.deck .chart .base{stroke:var(--ink3);stroke-width:1}
.deck .legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;color:var(--ink2);margin:0 0 10px}
.deck .legend span{display:flex;align-items:center;gap:7px}
.deck .legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.deck .tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--surface);font-size:13px;line-height:1.35;padding:7px 10px;border-radius:5px;white-space:nowrap;opacity:0;transition:opacity .08s;z-index:3}
.deck .tip.on{opacity:1}
.deck .tip b{display:block;margin-bottom:2px}
.deck .tip i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px}
.deck details.datatable{margin-top:8px;font-size:14px}
.deck details.datatable summary{cursor:pointer;color:var(--ink2);padding:4px 0}

/* tables */
.deck table.dt{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
.deck table.dt th{text-align:left;font-weight:600;color:var(--ink2);border-bottom:1.5px solid var(--ink3);padding:8px 12px 8px 0}
.deck table.dt td{border-bottom:1px solid var(--rule);padding:9px 12px 9px 0;vertical-align:top}
.deck table.dt td.num,.deck table.dt th.num{text-align:right}
.deck .tscroll{overflow-x:auto}

/* media */
.deck .media{display:grid;gap:28px}
.deck .media.grid{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.deck .media figure{margin:0}
.deck .media .ratio{position:relative;aspect-ratio:16/9;background:#000;border-radius:6px;overflow:hidden}
.deck .media .ratio iframe,.deck .media .ratio video{position:absolute;inset:0;width:100%;height:100%;border:0}
.deck .media img{width:100%;height:auto;display:block;border-radius:6px}
.deck .media audio{width:100%}
.deck .media iframe.spot{width:100%;height:152px;border:0;border-radius:12px}
.deck .media figcaption{font-size:15px;color:var(--ink2);margin-top:9px}
.deck .media .linkcard{display:block;padding:18px 20px;border:1px solid var(--rule);border-radius:6px;background:var(--surface);text-decoration:none;word-break:break-all}
.deck .print-link{display:none}

/* text */
.deck .prose{max-width:66ch;font-size:18px}
.deck .prose p{margin:0 0 1em}
.deck .prose ul{margin:0 0 1em;padding-left:1.2em}
.deck .prose li{margin:.25em 0}

/* packages */
.deck .tiers{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;align-items:stretch}
.deck .tier{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:26px 24px;display:flex;flex-direction:column}
.deck .tier.feat{border:2px solid var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 12%,transparent)}
.deck .tier .tn{font-weight:700;font-size:19px}
.deck .tier .flag{font-size:13px;color:var(--accent);font-weight:700;margin-bottom:6px}
.deck.scheme-dark .tier .flag{color:color-mix(in srgb,var(--accent) 60%,white)}
.deck .tier .price{font-family:var(--display);font-stretch:var(--display-stretch);font-weight:var(--display-weight);font-size:38px;line-height:1.05;margin:14px 0 2px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.deck .tier .cad{color:var(--ink3);font-size:14px;margin-bottom:16px}
.deck .tier ul{list-style:none;padding:0;margin:0 0 10px;flex:1}
.deck .tier li{padding:7px 0 7px 22px;border-top:1px solid var(--rule);position:relative;font-size:15.5px}
.deck .tier li::before{content:"";position:absolute;left:2px;top:15px;width:9px;height:5px;border-left:2px solid var(--accent);border-bottom:2px solid var(--accent);transform:rotate(-45deg)}
.deck .tier .tnote{font-size:13px;color:var(--ink3)}
.deck .fine{font-size:14px;color:var(--ink3);margin-top:22px;max-width:70ch}

/* logos */
.deck .logos{display:flex;flex-wrap:wrap;gap:28px 44px;align-items:center}
.deck .logos a,.deck .logos span{display:flex;align-items:center;text-decoration:none}
.deck .logos img{height:44px;width:auto;max-width:180px;object-fit:contain;filter:grayscale(1);opacity:.85}
.deck .logos a:hover img{filter:none;opacity:1}
.deck .logos .word{font-family:var(--display);font-stretch:var(--display-stretch);font-weight:700;font-size:22px;color:var(--ink2)}

/* quote */
.deck .quote{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:start}
.deck .quote .mark{font-family:var(--display);font-weight:800;font-size:110px;line-height:.75;color:var(--accent)}
.deck .quote blockquote{margin:0;font-family:var(--display);font-stretch:calc(var(--display-stretch) * .9);font-weight:600;font-size:clamp(24px,2.6vw,34px);line-height:1.25;letter-spacing:-.01em;max-width:34ch}
.deck .quote .who{display:flex;gap:12px;align-items:center;margin-top:20px;font-size:16px}
.deck .quote .who img{width:48px;height:48px;border-radius:50%;object-fit:cover}
.deck .quote .who span{color:var(--ink3)}

/* contact */
.deck .contact{background:var(--accent);color:var(--accent-ink)}
.deck .contact h2.sh{color:inherit}
.deck .contact .intro{color:inherit;opacity:.9}
.deck .contact .cta{background:var(--accent-ink);color:var(--accent)}
.deck .contact .cta.ghost{background:transparent;color:var(--accent-ink);box-shadow:inset 0 0 0 1.5px currentColor}
.deck .contact .mail{font-size:clamp(20px,2.4vw,28px);font-weight:700;margin:0 0 26px;display:inline-block}
.deck .contact .btns{display:flex;flex-wrap:wrap;gap:12px}
.deck .colophon{padding:26px 0 30px;font-size:13px;color:var(--ink3);border-top:1px solid var(--rule)}
.deck .colophon p{margin:0 0 .4em;max-width:90ch}

/* slides presentation */
.deck.slides section.sec{min-height:100vh;display:flex;flex-direction:column;justify-content:center}
.deck.slides section.sec>.wrap{width:100%}
html.slides-on{scroll-snap-type:y proximity}
html.slides-on .deck section.sec{scroll-snap-align:start}

@media (max-width:700px){
  .deck{font-size:16px}
  .deck .wrap{padding:0 20px}
  .deck section.sec{padding:52px 0}
  .deck .tile{padding:0 12px 0 14px}
  .deck .tiles{grid-template-columns:1fr 1fr}
  .deck .quote{grid-template-columns:1fr;gap:6px}
  .deck .quote .mark{font-size:70px}
  .deck .cover h1{margin-top:36px}
}

@media print{
  @page{margin:12mm}
  body{background:#fff}
  .topbar,.editor,.viewbar,.toast,dialog{display:none!important}
  .workspace{display:block;height:auto}
  .preview{padding:0;overflow:visible}
  .preview .frame{border:0;box-shadow:none;max-width:none}
  .deck section.sec{break-inside:avoid;padding:36px 0;min-height:0!important}
  .deck .cover{min-height:0;padding:30px 0}

function hydrateDeck(d){
  const b = blankDeck();
  d = d && typeof d === 'object' ? d : b;
  d.meta = Object.assign({}, b.meta, d.meta || {});
  d.theme = Object.assign({}, b.theme, d.theme || {});
  d.sources = Array.isArray(d.sources) ? d.sources : [];
  d.sections = Array.isArray(d.sections) ? d.sections.filter(s => s && SCHEMA[s.type]) : [];
  d.sections.forEach(s => { if (!s.id) s.id = uid('s'); });
  d.sources.forEach(s => { if (!s.id) s.id = uid('src_'); });
  return d;
}
function loadData(){
  const next = {};
  for (const src of state.deck.sources){
    const prev = state.data[src.id];
    const parsed = parseCSV(src.csv || '');
    next[src.id] = Object.assign({ live: false, error: '', fetchedAt: src.fetchedAt || null }, prev || {}, parsed);
    if (prev && prev.liveCsv != null && state.mode === 'view') Object.assign(next[src.id], parseCSV(prev.liveCsv));
  }
  state.data = next;
}
async function fetchSource(src){
  if (!src.url) return;
  const entry = state.data[src.id] || (state.data[src.id] = {cols: [], rows: []});
  entry.loading = true; entry.error = '';
  try {
    const res = await fetch(src.url, { cache: 'no-store' });
    if (!res.ok) throw new Error('The link answered with error ' + res.status + '.');
    const text = await res.text();
    if (/^\s*<(!doctype|html)/i.test(text)) throw new Error('The link returned a web page, not CSV. In Google Sheets use File > Share > Publish to web, and choose CSV.');
    const parsed = parseCSV(text);
    if (!parsed.cols.length) throw new Error('The file at that link is empty.');
    Object.assign(entry, parsed, { live: true, fetchedAt: Date.now(), error: '', liveCsv: text });
    if (state.mode === 'build'){ src.csv = text; src.fetchedAt = entry.fetchedAt; scheduleSave(); }
  } catch (e) {
    entry.live = false;
    entry.error = (e && e.message && !/Failed to fetch|NetworkError|Load failed/i.test(e.message)) ? e.message
      : 'Could not reach the link. Check that it is public and allows other sites to read it (Google Sheets "Publish to web" CSV links and GitHub raw links do). Showing the saved snapshot.';
  } finally { entry.loading = false; }
}

  const withUrl = state.deck.sources.filter(s => s.url);
  if (!withUrl.length){ if (showToast) toast('No data source has a link, so the saved numbers are shown.'); return; }

}

function accentInk(hex){
  const m = String(hex || '').match(/^#?([0-9a-f]{6})$/i); if (!m) return '#ffffff';
  const n = parseInt(m[1], 16), r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  const L = c => { c /= 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
  const lum = 0.2126 * L(r) + 0.7152 * L(g) + 0.0722 * L(b);
  return lum > 0.36 ? '#10171d' : '#ffffff';
}
function srcById(id){ return state.deck.sources.find(s => s.id === id); }
function dataFor(id){ return state.data[id] || null; }
function creditFor(id, override){
  if (!state.deck.meta.showSources) return '';
  const src = srcById(id); const d = dataFor(id);
  const parts = [];
  const credit = (override || (src && src.note) || '').trim();
  if (credit) parts.push('Source: ' + credit.replace(/\.$/, '') + '.');
  const span = dateSpan(d); if (span) parts.push('Covers ' + span + '.');
  if (d && d.fetchedAt && !span) parts.push((d.live ? 'Live data as of ' : 'Data as of ') + fmtDate(d.fetchedAt) + '.');
  return parts.join(' ');
}
function rowsFor(id, lastN){
  const d = dataFor(id); if (!d) return [];
  let rows = d.rows || [];
  if (lastN && +lastN > 0) rows = rows.slice(-(+lastN));
  return rows;
}
function aggregate(rows, col, agg){
  const vals = rows.map(r => toNum(r[col])).filter(v => v != null);
  if (agg === 'count') return rows.length;
  if (!vals.length) return null;
  switch (agg){
    case 'first': return vals[0];
    case 'sum': return vals.reduce((a, b) => a + b, 0);
    case 'avg': return vals.reduce((a, b) => a + b, 0) / vals.length;
    case 'max': return Math.max(...vals);
    case 'min': return Math.min(...vals);
    default: return vals[vals.length - 1];
  }
}

    '<div class="actions"><button class="btn primary" type="button" id="sh-close">Done</button></div>';
  dlg.appendChild(wrap);
  $('#sh-view', dlg).value = viewLink; $('#sh-edit', dlg).value = editLink;
  const len = viewLink.length;
  $('#sh-len', dlg).textContent = len.toLocaleString() + ' characters' + (len > 8000 ? '. Long links can break in some email and chat apps' + (hasData ? '; uploaded images are the usual cause. Hosted image links keep it short.' : '.') : '.') + (stripped ? ' Linked data is fetched live instead of packed in.' : '');
  const copy = async (txt, msg) => { try { await navigator.clipboard.writeText(txt); toast(msg); } catch(e){ toast('Select the text and copy it manually.'); } };
  $('#sh-cv', dlg).onclick = () => copy(viewLink, 'Viewer link copied.');
  $('#sh-ce', dlg).onclick = () => copy(editLink, 'Builder link copied.');
  const jin = $('#sh-json', dlg), jout = $('#sh-jlink', dlg);
  const updJ = () => { const u = jin.value.trim(); jout.value = u ? baseUrl() + '?deck=' + encodeURIComponent(u) : ''; };
  jin.addEventListener('input', updJ);
  $('#sh-cj', dlg).onclick = () => jout.value ? copy(jout.value, 'Link copied.') : toast('Paste the address of your deck file first.');
  $('#sh-close', dlg).onclick = () => dlg.close();
  dlg.showModal();
}
function exportHTML(){
  const payload = JSON.stringify({ deck: state.deck, view: true }).replace(/</g, '\\u003c');
  const re = new RegExp('<script id="embedded-deck" type="application/json">[\\s\\S]*?<' + '/script>');
  const out = PRISTINE.replace(re, () => '<script id="embedded-deck" type="application/json">' + payload + '<' + '/script>');
  download(slug(state.deck.meta.title) + '.html', out, 'text/html');
  toast('Exported. The file opens as the finished pitch; linked data still updates.');
}
function saveJSON(){ download(slug(state.deck.meta.title) + '.json', JSON.stringify(state.deck, null, 2), 'application/json'); toast('Deck saved as a file.'); }

/* ================= Wiring ================= */
function useDeck(d, origin){
  state.deck = hydrateDeck(d); state.origin = origin || 'local'; state.data = {};
  state.openSections = new Set(); state.openSources = new Set();
  loadData();
}
$$('.tabs button').forEach(b => b.addEventListener('click', () => {
  state.tab = b.dataset.tab;
  $$('.tabs button').forEach(x => x.setAttribute('aria-selected', String(x === b)));
  ['sections','data','deck'].forEach(t => $('#p-' + t).hidden = t !== state.tab);
  if (state.tab === 'data') renderDataEditor();
  if (state.tab === 'sections') renderSectionsEditor();
}));
$('#b-new').onclick = () => { if (!confirm('Start a new, empty deck? Save a file first if you want to keep this one.')) return; useDeck(blankDeck()); const c = Object.assign({ id: uid('s'), type: 'cover' }, SCHEMA.cover.make()); state.deck.sections.push(c); state.openSections.add(c.id); changed(); renderEditor(); renderDeck(); };
$('#b-sample').onclick = () => { if (state.deck.sections.length && !confirm('Replace the current deck with the sample? Save a file first if you want to keep it.')) return; useDeck(sampleDeck()); changed(); renderEditor(); renderDeck(); };
$('#b-open').onclick = () => $('#f-open').click();
$('#f-open').onchange = e => { const f = e.target.files[0]; if (!f) return; f.text().then(t => { try { const d = JSON.parse(t); useDeck(d.deck || d); changed(); renderEditor(); renderDeck(); refreshAll(false); toast('Opened ' + f.name + '.'); } catch(err){ toast('That file is not a deck saved by this tool.'); } }); e.target.value = ''; };
$('#b-save').onclick = saveJSON;
$('#b-export').onclick = exportHTML;
$('#b-print').onclick = () => window.print();
$('#v-print').onclick = () => window.print();
$('#b-share').onclick = () => openShare().catch(e => toast('Could not build the link: ' + e.message));
$('#b-present').onclick = () => { state.cameFromBuild = true; setMode('view'); window.scrollTo(0, 0); };
$('#v-slides').onclick = toggleSlides;
$('#v-refresh').onclick = () => refreshAll(true);
$('#v-edit').onclick = () => {
  if (!state.cameFromBuild){
    let hasLocal = false; try { hasLocal = !!localStorage.getItem(LS_KEY); } catch(e){}
    if (hasLocal && !confirm('Open this deck in the builder? It will replace the deck saved in this browser.')) return;
    state.origin = 'local'; history.replaceState(null, '', baseUrl()); scheduleSave();
  }
  state.cameFromBuild = true; setMode('build'); renderEditor();
};
$('#deck-root').addEventListener('click', e => {
  if (state.mode !== 'build') return;
  if (e.target.closest('a,iframe,video,audio,summary,details')) return;
  const sec = e.target.closest('section.sec[data-sid]'); if (!sec) return;
  const id = sec.dataset.sid;
  if (state.tab !== 'sections') $('.tabs button[data-tab="sections"]').click();
  state.openSections.add(id); renderSectionsEditor();
  const c = $('[data-card="' + CSS.escape(id) + '"]'); if (c){ c.scrollIntoView({ block: 'start' }); const f = c.querySelector('.body input,.body textarea,.body select'); f && f.focus({preventScroll:true}); }
});
$('#deck-root').addEventListener('click', e => {
  const a = e.target.closest('a[href^="#"]'); if (!a) return;
  const t = document.getElementById(a.getAttribute('href').slice(1)); if (t){ e.preventDefault(); t.scrollIntoView({ behavior: 'smooth' }); }
});
window.addEventListener('resize', debounce(() => renderDeck(), 150));
window.addEventListener('beforeprint', () => { if (state.slides){ state.wasSlides = true; toggleSlides(); } });
window.addEventListener('afterprint', () => { if (state.wasSlides){ state.wasSlides = false; toggleSlides(); } });

/* ================= Start ================= */
(async function init(){
  let embedded = null;
  try { embedded = JSON.parse($('#embedded-deck').textContent); } catch(e){}
  const params = new URLSearchParams(location.search);
  const hash = location.hash;
  try {
    if (embedded && embedded.deck){ useDeck(embedded.deck, 'embedded'); setMode('view'); }
    else if (params.get('deck')){
      const u = new URL(params.get('deck'), location.href);
      if (!/^https?:$/.test(u.protocol)) throw new Error('The deck address must be a web link.');
      const res = await fetch(u.href, { cache: 'no-store' }); if (!res.ok) throw new Error('Could not load the deck file (error ' + res.status + ').');
      const d = await res.json(); useDeck(d.deck || d, 'remote'); setMode('view');
    }
    else if (hash.startsWith('#view=')){ const o = await unpack(hash.slice(6)); useDeck(o.deck || o, 'link'); setMode('view'); }
    else if (hash.startsWith('#edit=')){ const o = await unpack(hash.slice(6)); useDeck(o.deck || o, 'local'); history.replaceState(null, '', baseUrl()); scheduleSave(); state.cameFromBuild = true; setMode('build'); renderEditor(); toast('Opened an editable copy from the link.'); }
    else {
      let saved = null, starter = null, seen = null;
      try { saved = JSON.parse(localStorage.getItem(LS_KEY) || 'null'); seen = localStorage.getItem(LS_KEY + '.starter'); } catch(e){}
      try { starter = JSON.parse($('#starter-deck').textContent); } catch(e){}
      if (starter && starter.starterId && seen !== starter.starterId){
        saved = starter; try { localStorage.setItem(LS_KEY + '.starter', starter.starterId); } catch(e){}
        scheduleSave();
      }
      useDeck(saved || sampleDeck(), 'local'); state.cameFromBuild = true; setMode('build'); renderEditor();
    }
  } catch (e) {
    console.error(e);
    useDeck(sampleDeck(), 'local'); state.cameFromBuild = true; setMode('build'); renderEditor();
    toast('Could not open that link: ' + (e.message || 'it may be incomplete') + ' Showing the sample instead.', 6000);
  }
  refreshAll(false);
})();
</script></body></html>
